[manifest]
version = "1.0.0"
priority = 0

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if #G.hand.cards < 1 and #G.deck.cards < 1 and #G.play.cards < 1 then"
position = "at"
payload = '''if not G.GAME.modifiers.no_cards and #G.hand.cards < 1 and #G.deck.cards < 1 and #G.play.cards < 1 then'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = "if #G.hand.cards < 1 and #G.deck.cards < 1 then"
position = "at"
payload = '''if not G.GAME.modifiers.no_cards and #G.hand.cards < 1 and #G.deck.cards < 1 then'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if #G.hand.highlighted <= 0 or G.GAME.blind.block_play or #G.hand.highlighted > 5 then"
position = "at"
payload = '''if (#G.hand.highlighted <= 0 and not G.GAME.modifiers.no_cards) or G.GAME.blind.block_play or #G.hand.highlighted > 5 then'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.deck:emplace(c1)"
position = "at"
payload = '''if G.GAME.modifiers.no_cards then
    SMODS.destroy_cards(c1)
else
    G.deck:emplace(c1)
end'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "G.deck:emplace(card)"
position = "at"
payload = '''if G.GAME.modifiers.no_cards then
    SMODS.destroy_cards(card)
else
    G.deck:emplace(card)
end'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/misc_functions.lua"
pattern = "G.deck:emplace(_card)"
position = "at"
payload = '''if G.GAME.modifiers.no_cards then
    SMODS.destroy_cards(_card)
else
    G.deck:emplace(_card)
end'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/state_events.lua"
pattern = "G.hand.config.card_limit <= 0 and #G.hand.cards == 0 then"
position = "before"
payload = '''not G.GAME.modifiers.no_cards and'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = "table.sort(other_tab, function (a, b) return a.order < b.order end)"
position = "after"
payload = '''
local size_mult = 1
if #other_tab > 4 then size_mult = 3 / #other_tab end
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "functions/UI_definitions.lua"
pattern = """local temp_blind = AnimatedSprite(0,0,1,1, G.ANIMATION_ATLAS[v.atlas or ''] or G.ANIMATION_ATLAS['blind_chips'], v.pos)"""
position = "after"
payload = '''
temp_blind.T.h = temp_blind.T.h * size_mult
'''
match_indent = true
times = 1

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if (not G.hand.cards[1]) and G.deck.cards[1] then
'''
position = "at"
payload = '''
if (not G.hand.cards[1]) and G.deck.cards[1] and G.hand.config.card_limit > 0 then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "game.lua"
pattern = '''
if G.FUNCS.draw_from_deck_to_hand(nil) then
'''
position = "at"
payload = '''
if not G.GAME.modifiers.no_cards and G.FUNCS.draw_from_deck_to_hand(nil) then
'''
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if G.GAME.current_round.discards_left <= 0 or #G.hand.highlighted <= 0 or #G.hand.highlighted > math.max(G.GAME.starting_params.discard_limit, 0) then"
position = "at"
payload = "if not G.GAME.modifiers.no_cards and (G.GAME.current_round.discards_left <= 0 or #G.hand.highlighted <= 0 or #G.hand.highlighted > math.max(G.GAME.starting_params.discard_limit, 0)) then"
match_indent = true

[[patches]]
[patches.pattern]
target = "functions/button_callbacks.lua"
pattern = "if #G.hand.highlighted <= 0 or G.GAME.blind.block_play or #G.hand.highlighted > math.max(G.GAME.starting_params.play_limit, 1) then"
position = "at"
payload = "if (not G.GAME.modifiers.no_cards and #G.hand.highlighted <= 0) or G.GAME.blind.block_play or #G.hand.highlighted > math.max(G.GAME.starting_params.play_limit, 1) then"
match_indent = true